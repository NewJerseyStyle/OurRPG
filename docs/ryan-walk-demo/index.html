<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scout Mission: Fog of War</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* --- Cyberpunk / Tactical UI Theme --- */
        :root {
            --primary-color: #00ffcc;
            --bg-dark: rgba(0, 10, 20, 0.8);
            --danger-color: #ff3333;
        }
        
        body { margin: 0; padding: 0; font-family: 'Courier New', monospace; overflow: hidden; background: #000; }
        
        /* Map Container */
        #map { height: 100vh; width: 100vw; z-index: 0; background: #000; }

        /* UI Layer */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1000;
        }

        /* Top HUD */
        .hud-top {
            padding: 15px;
            background: linear-gradient(to bottom, var(--bg-dark), transparent);
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            text-shadow: 0 0 5px #000;
        }

        .status-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--primary-color);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        /* Indicators */
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .online { background: #0f0; box-shadow: 0 0 8px #0f0; }
        .offline { background: #f00; }
        .syncing { background: #ff0; }

        /* Bottom Controls */
        .hud-bottom {
            padding: 20px;
            background: linear-gradient(to top, var(--bg-dark), transparent);
            pointer-events: auto;
            text-align: center;
        }

        .btn-action {
            background: rgba(0, 255, 204, 0.8);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 2px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.95); background: #fff; }

        .stat-row { margin: 2px 0; }
        .highlight { color: white; font-weight: bold; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- Top Section -->
        <div class="hud-top">
            <div class="status-box">
                <div class="stat-row"><span class="dot online" id="status-dot"></span> <span id="status-text">Initializing...</span></div>
                <div class="stat-row">ID: <span class="highlight" id="user-id">--</span></div>
                <div class="stat-row">Ver: <span id="ver-display">0</span></div>
            </div>
            
            <div class="status-box" style="text-align: right;">
                <div class="stat-row">SPD: <span class="highlight" id="speed-display">0</span> km/h</div>
                <div class="stat-row">GPS: <span id="gps-acc">Waiting</span></div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="hud-bottom">
            <div style="color: #ccc; font-size: 10px; margin-bottom: 10px; text-shadow: 0 0 2px #000;">MISSION: EXPLORE & REVEAL</div>
            <button class="btn-action" onclick="reportLocation()">Report Location (+50)</button>
        </div>
    </div>

    <div id="map"></div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

        // === CONFIGURATION ===
        // REPLACE THIS WITH YOUR HF SPACE!
        const HF_SPACE = "npc0/DemoWalkAPI"; 
        // =====================

        // --- Game State ---
        const myUserId = "Ranger-" + Math.floor(Math.random() * 9999);
        document.getElementById('user-id').innerText = myUserId;
        
        let lastSyncTime = 0;
        let currentSnapshotVer = -1;
        let isSyncing = false;
        
        let myLat = null, myLng = null, mySpeed = 0;
        let isFirstLoad = true;

        // --- 1. Map Setup (Satellite) ---
        const map = L.map('map', {
            zoomControl: false, 
            attributionControl: false,
            zoomAnimation: true
        }).setView([25.0330, 121.5654], 16);

        // Using Esri World Imagery for Satellite view
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // --- 2. Custom Fog Layer (Soft Blur & Optimized) ---
        L.FogLayer = L.GridLayer.extend({
            createTile: function (coords) {
                const tile = L.DomUtil.create('canvas', 'leaflet-tile');
                const size = this.getTileSize();
                tile.width = size.x;
                tile.height = size.y;

                const ctx = tile.getContext('2d');
                
                // A. Draw Darkness (Fog)
                // 0.9 opacity to allow slight visibility of terrain features (looks cooler)
                // Or 0.95 for hardcore darkness
                ctx.fillStyle = 'rgba(0, 0, 0, 0.92)'; 
                ctx.fillRect(0, 0, tile.width, tile.height);

                // B. Prepare to Erase (Light Up)
                ctx.globalCompositeOperation = 'destination-out';
                
                const bounds = this._tileCoordsToBounds(coords);
                
                // Optimize: Only loop through ALL points if we haven't implemented spatial indexing yet.
                // For < 5000 points, simple loop is acceptable on modern phones.
                allKnownPoints.forEach(pt => {
                    const latLng = L.latLng(pt[0], pt[1]);
                    
                    // Margin of error (pad) to account for the radius extending into this tile
                    if (bounds.pad(0.2).contains(latLng)) {
                        const p = this._latLngToTilePixel(latLng, coords);
                        let radius = pt[2] || 20;
                        
                        // Increase radius slightly for the soft blur effect
                        const drawRadius = radius * 1.5;

                        // Soft Gradient Logic
                        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, drawRadius);
                        
                        // Center (0): Fully Transparent (Alpha 1 in destination-out means Remove 100%)
                        grad.addColorStop(0, 'rgba(0,0,0,1)'); 
                        
                        // Middle (0.4): Still mostly clear
                        grad.addColorStop(0.4, 'rgba(0,0,0,0.8)');
                        
                        // Edge (1.0): No removal (Alpha 0)
                        grad.addColorStop(1, 'rgba(0,0,0,0)'); 

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, drawRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                return tile;
            },

            // Helper: Calculate pixel position relative to the tile
            _latLngToTilePixel: function(latLng, coords) {
                const mapPos = map.project(latLng, coords.z);
                const size = this.getTileSize();
                const tileNw = new L.Point(coords.x * size.x, coords.y * size.y);
                return mapPos.subtract(tileNw);
            },

            // Fixed NW calculation
            _tileCoordsToNw: function (coords) {
                const size = this.getTileSize();
                return new L.Point(coords.x * size.x, coords.y * size.y);
            },

            _tileCoordsToBounds: function (coords) {
                var nw = this._tileCoordsToNw(coords),
                    se = this._tileCoordsToNw(new L.Point(coords.x + 1, coords.y + 1));
                return new L.LatLngBounds(map.unproject(nw, coords.z), map.unproject(se, coords.z));
            }
        });

        let allKnownPoints = []; 
        const fogLayer = new L.FogLayer({ tileSize: 512, updateWhenIdle: false }).addTo(map);

        // My Location Marker (Cyberpunk Style)
        const myIcon = L.divIcon({
            className: 'my-div-icon',
            html: '<div style="width:14px; height:14px; background:#00ffcc; border-radius:50%; box-shadow:0 0 15px #00ffcc, 0 0 5px white; border:2px solid #fff;"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9] // Center the icon
        });
        const myMarker = L.marker([0,0], {icon: myIcon, zIndexOffset: 1000}).addTo(map);


        // --- 3. GPS Logic (Auto-Follow) ---
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude, speed, accuracy } = pos.coords;
                myLat = latitude;
                myLng = longitude;
                mySpeed = (speed || 0) * 3.6; 

                // Update UI
                document.getElementById('speed-display').innerText = mySpeed.toFixed(1);
                document.getElementById('gps-acc').innerText = accuracy ? Math.round(accuracy) + "m" : "N/A";

                // Move Marker
                myMarker.setLatLng([latitude, longitude]);
                
                // Auto-Follow Camera Logic
                // Use panTo for smooth animation instead of setView
                map.panTo([latitude, longitude], {
                    animate: true,
                    duration: 1.0, // Smooth glide
                    easeLinearity: 0.25
                });

            }, err => console.error(err), { 
                enableHighAccuracy: true,
                maximumAge: 1000 
            });
        }

        // --- 4. Network Sync Logic ---
        async function startSync() {
            let client;
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');

            try {
                client = await Client.connect(HF_SPACE);
                statusText.innerText = "Online";
                statusDot.className = "dot online";
            } catch (e) {
                statusText.innerText = "Offline";
                statusDot.className = "dot offline";
                return;
            }

            setInterval(async () => {
                if (isSyncing) return;
                isSyncing = true;
                
                // Only show "Syncing" yellow light if it takes too long
                // statusDot.className = "dot syncing"; 

                try {
                    const result = await client.predict("/sync", [
                        lastSyncTime,
                        currentSnapshotVer,
                        myUserId,
                        myLat,
                        myLng,
                        mySpeed
                    ]);

                    const res = result.data[0];
                    let needRedraw = false;

                    // A. Snapshot Update
                    if (res.sync_type === "snapshot") {
                        console.log("Snapshot Loaded:", res.payload.length);
                        allKnownPoints = res.payload;
                        if (res.recent_events) {
                            allKnownPoints = allKnownPoints.concat(res.recent_events);
                        }
                        currentSnapshotVer = res.snapshot_version;
                        document.getElementById('ver-display').innerText = currentSnapshotVer;
                        needRedraw = true;
                    } 
                    // B. Delta Update
                    else if (res.payload && res.payload.length > 0) {
                        // Append new points
                        allKnownPoints = allKnownPoints.concat(res.payload);
                        needRedraw = true;
                    }

                    // Only redraw if we actually got new data (Fixes heartbeat flicker)
                    if (needRedraw) {
                        fogLayer.redraw();
                    }

                    lastSyncTime = res.server_time;
                    
                    // Keep dot green unless error
                    statusDot.className = "dot online";

                } catch (err) {
                    console.warn(err);
                    statusDot.className = "dot offline";
                } finally {
                    isSyncing = false;
                }

            }, 2000);
        }

        startSync();

        window.reportLocation = function() {
            if(!myLat) { alert("Waiting for GPS signal..."); return; }
            const note = prompt("Name of the location (Music Room, Hall, etc.):");
            if(note) alert(`Location Saved: ${note}`);
        }

    </script>
</body>
</html>
