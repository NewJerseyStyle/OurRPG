<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scout Mission: Fog of War</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        /* --- Cyberpunk / Tactical UI Theme --- */
        :root {
            --primary-color: #00ffcc;
            --bg-dark: rgba(0, 10, 20, 0.9);
            --danger-color: #ff3333;
        }
        
        body { margin: 0; padding: 0; font-family: 'Courier New', monospace; overflow: hidden; background: #000; }
        
        /* Map Container */
        #map { height: 100vh; width: 100vw; z-index: 0; }

        /* UI Layer - Uses Flexbox to separate Top and Bottom to prevent overlap */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to map */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1000;
        }

        /* Top HUD */
        .hud-top {
            padding: 15px;
            background: linear-gradient(to bottom, var(--bg-dark), transparent);
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .status-box {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--primary-color);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: auto;
        }

        /* Indicators */
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .online { background: #0f0; box-shadow: 0 0 8px #0f0; }
        .offline { background: #f00; }
        .syncing { background: #ff0; }

        /* Bottom Controls */
        .hud-bottom {
            padding: 20px;
            background: linear-gradient(to top, var(--bg-dark), transparent);
            pointer-events: auto;
            text-align: center;
        }

        .btn-action {
            background: var(--primary-color);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 2px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: all 0.2s;
        }
        .btn-action:active { transform: scale(0.95); background: #fff; }

        /* Stats text */
        .stat-row { margin: 2px 0; }
        .highlight { color: white; font-weight: bold; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- Top Section -->
        <div class="hud-top">
            <div class="status-box">
                <div class="stat-row"><span class="dot online" id="status-dot"></span> <span id="status-text">Initializing...</span></div>
                <div class="stat-row">ID: <span class="highlight" id="user-id">--</span></div>
                <div class="stat-row">Ver: <span id="ver-display">0</span></div>
            </div>
            
            <div class="status-box" style="text-align: right;">
                <div class="stat-row">SPD: <span class="highlight" id="speed-display">0</span> km/h</div>
                <div class="stat-row">GPS: <span id="gps-acc">Waiting</span></div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div class="hud-bottom">
            <div style="color: #aaa; font-size: 10px; margin-bottom: 10px;">MISSION: UNCOVER THE CITY</div>
            <button class="btn-action" onclick="reportLocation()">Report POI (+50)</button>
        </div>
    </div>

    <div id="map"></div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

        // === CONFIGURATION ===
        // REPLACE THIS WITH YOUR HF SPACE!
        const HF_SPACE = "npc0/DemoWalkAPI"; 
        // =====================

        // --- Game State ---
        const myUserId = "Ranger-" + Math.floor(Math.random() * 9999);
        document.getElementById('user-id').innerText = myUserId;
        
        let lastSyncTime = 0;
        let currentSnapshotVer = -1;
        let isSyncing = false;
        
        let myLat = null, myLng = null, mySpeed = 0;

        // --- 1. Map Setup ---
        // We use a dark basemap so when the fog is revealed, it looks cool.
        const map = L.map('map', {
            zoomControl: false, // Move zoom to not overlap UI? Or just hide it
            attributionControl: false
        }).setView([25.0330, 121.5654], 15);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // --- 2. Custom Fog Layer (The Magic) ---
        // This creates a Canvas that covers the map. 
        // It is filled with Black. We "erase" circles where players have been.
        L.FogLayer = L.GridLayer.extend({
            createTile: function (coords) {
                const tile = L.DomUtil.create('canvas', 'leaflet-tile');
                const size = this.getTileSize();
                tile.width = size.x;
                tile.height = size.y;

                const ctx = tile.getContext('2d');
                
                // 1. Fill with Fog (Black with 95% opacity)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.95)'; 
                ctx.fillRect(0, 0, tile.width, tile.height);

                // 2. Prepare to Erase (Reveal)
                ctx.globalCompositeOperation = 'destination-out';
                
                // 3. Draw holes for known points
                // Note: In a real GridLayer, we should only check points relevant to this tile coordinates.
                // For simplicity in this prototype, we iterate the compressed grid.
                // (Performance note: If points > 2000, we need spatial indexing like QuadTree)
                
                const bounds = this._tileCoordsToBounds(coords);
                
                // Draw stored snapshot points
                allKnownPoints.forEach(pt => {
                    const latLng = L.latLng(pt[0], pt[1]);
                    // Only draw if point is somewhat near this tile to save perf
                    if (bounds.contains(latLng) || bounds.pad(0.1).contains(latLng)) {
                        const p = map.project(latLng, coords.z).subtract(this._tileCoordsToNw(coords));
                        const radius = pt[2] || 20; // Radius from server
                        
                        // Create a soft gradient edge for the hole
                        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
                        grad.addColorStop(0, 'rgba(0,0,0,1)');   // Center: Fully transparent (Eraser strength 1)
                        grad.addColorStop(0.7, 'rgba(0,0,0,1)'); 
                        grad.addColorStop(1, 'rgba(0,0,0,0)');   // Edge: No erasure

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                return tile;
            },

            // [FIXED] Correctly calculate NW pixel coordinates from tile coordinates
            _tileCoordsToNw: function (coords) {
                const size = this.getTileSize();
                return new L.Point(coords.x * size.x, coords.y * size.y);
            },

            _tileCoordsToBounds: function (coords) {
                var nw = this._tileCoordsToNw(coords),
                    se = this._tileCoordsToNw(new L.Point(coords.x + 1, coords.y + 1));
                return new L.LatLngBounds(map.unproject(nw, coords.z), map.unproject(se, coords.z));
            }
        });

        // Global storage for points: [lat, lng, radius]
        let allKnownPoints = []; 
        
        // Initialize Fog Layer
        const fogLayer = new L.FogLayer({ tileSize: 512 }).addTo(map);

        // My Location Marker (A glowing dot)
        const myIcon = L.divIcon({
            className: 'my-div-icon',
            html: '<div style="width:12px; height:12px; background:#00ffcc; border-radius:50%; box-shadow:0 0 10px #00ffcc; border:2px solid white;"></div>',
            iconSize: [16, 16]
        });
        const myMarker = L.marker([0,0], {icon: myIcon}).addTo(map);


        // --- 3. GPS Logic ---
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude, speed, accuracy } = pos.coords;
                myLat = latitude;
                myLng = longitude;
                mySpeed = (speed || 0) * 3.6; // m/s to km/h

                // Update UI
                document.getElementById('speed-display').innerText = mySpeed.toFixed(1);
                document.getElementById('gps-acc').innerText = accuracy ? Math.round(accuracy) + "m" : "N/A";

                // Move Marker
                myMarker.setLatLng([latitude, longitude]);
                
                // Center map initially
                if (lastSyncTime === 0) map.setView([latitude, longitude], 16);

            }, err => console.error(err), { enableHighAccuracy: true });
        }

        // --- 4. Network Sync Logic ---
        async function startSync() {
            let client;
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-dot');

            try {
                client = await Client.connect(HF_SPACE);
                statusText.innerText = "Connected";
                statusDot.className = "dot online";
            } catch (e) {
                statusText.innerText = "Connection Failed";
                statusDot.className = "dot offline";
                return;
            }

            setInterval(async () => {
                if (isSyncing) return;
                isSyncing = true;
                statusDot.className = "dot syncing";

                try {
                    const result = await client.predict("/sync", [
                        lastSyncTime,
                        currentSnapshotVer,
                        myUserId,
                        myLat,
                        myLng,
                        mySpeed
                    ]);

                    const res = result.data[0];
                    let needRedraw = false;

                    // A. Snapshot Update (Replace everything)
                    if (res.sync_type === "snapshot") {
                        console.log("Full Snapshot Received:", res.payload.length);
                        allKnownPoints = res.payload; // [lat, lng, radius]
                        
                        // If snapshot includes recent buffer
                        if (res.recent_events) {
                            allKnownPoints = allKnownPoints.concat(res.recent_events);
                        }
                        
                        currentSnapshotVer = res.snapshot_version;
                        document.getElementById('ver-display').innerText = currentSnapshotVer;
                        needRedraw = true;
                    } 
                    // B. Delta Update (Append new)
                    else if (res.payload && res.payload.length > 0) {
                        console.log("Delta Received:", res.payload.length);
                        // Append new points to our local cache
                        allKnownPoints = allKnownPoints.concat(res.payload);
                        needRedraw = true;
                    }

                    if (needRedraw) {
                        fogLayer.redraw(); // Trigger Canvas Redraw
                    }

                    lastSyncTime = res.server_time;
                    statusDot.className = "dot online";

                } catch (err) {
                    console.warn(err);
                    statusDot.className = "dot offline";
                } finally {
                    isSyncing = false;
                }

            }, 2000); // Sync every 2 seconds
        }

        startSync();

        // Button Action
        window.reportLocation = function() {
            if(!myLat) { alert("Waiting for GPS..."); return; }
            // Here you would open a modal or redirect to Google Forms
            const note = prompt("Enter location name/type:");
            if(note) alert(`Reported: ${note} at ${myLat.toFixed(5)}, ${myLng.toFixed(5)}`);
        }

    </script>
</body>
</html>
